<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>みんつく行田マップ｜みんなでつくる行田の観光マップ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="みんつく行田マップは、みんなのおすすめの場所や散策ルートを集めて育てる、行田の観光マップです。あなたのおすすめも投稿できます。" />
  <meta property="og:title" content="みんつく行田マップ" />
  <meta property="og:description" content="一緒に行田の観光マップを作りませんか？" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- MapLibre -->
  <link
    href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=20261112-1" />
  <link rel="stylesheet" href="css/map-preview.css?v=20261018-2" />
</head>
<body>

  <main class="map-stage">
    <section class="map-paper" aria-label="みんつく行田マップ">
      <div id="map"></div>
      <div class="paper-texture" aria-hidden="true"></div>
      <div class="paper-edge" aria-hidden="true"></div>
      <div class="petal-layer" id="petal-layer" aria-hidden="true"></div>

      <header class="map-header">
        <h1>みんつく行田マップ</h1>
        <p>みんなでつくる、行田の観光マップ</p>
      </header>

      <nav class="mobile-panel-controls" aria-label="&#22320;&#22259;&#12513;&#12491;&#12517;&#12540;">
        <button
          id="mobile-legend-toggle"
          class="mobile-panel-toggle"
          type="button"
          aria-controls="legend"
          aria-expanded="false"
        >&#12473;&#12509;&#12483;&#12488;</button>
        <button
          id="mobile-route-toggle"
          class="mobile-panel-toggle"
          type="button"
          aria-controls="route-panel"
          aria-expanded="false"
        >&#12523;&#12540;&#12488;</button>
      </nav>

      <div class="legend" id="legend"></div>
      <aside class="route-panel" id="route-panel" aria-label="おすすめ観光ルート"></aside>

      <button id="feedback-open" class="feedback-fab" type="button" aria-haspopup="dialog">
        <span class="feedback-fab-icon" aria-hidden="true">&#9998;</span>
        <span>おすすめ・情報を投稿</span>
      </button>
    </section>
  </main>

  <div id="spot-panel" class="spot-panel is-hidden">
    <div class="spot-panel-header">
      <div class="spot-panel-title">&#12473;&#12509;&#12483;&#12488;&#35443;&#32048;</div>
      <button id="spot-panel-close" class="spot-panel-close" aria-label="close">&times;</button>
    </div>
    <div id="spot-panel-body" class="spot-panel-body"></div>
  </div>

  <div id="feedback-dialog" class="feedback-dialog is-hidden" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
    <div class="feedback-backdrop" data-feedback-close></div>
    <section class="feedback-sheet">
      <header class="feedback-header">
        <div>
          <p class="feedback-kicker">一緒に行田の観光マップを作りませんか？</p>
          <h2 id="feedback-title">投稿方法を選ぶ</h2>
        </div>
        <button id="feedback-close" class="feedback-close" type="button" aria-label="投稿方法の選択を閉じる">&times;</button>
      </header>

      <div class="feedback-choices">
        <p id="feedback-context" class="feedback-context" hidden></p>
        <a id="feedback-text-link" class="feedback-choice" href="https://docs.google.com/forms/d/e/1FAIpQLSdADYHqjtGAR34llFte1ydv7acGpSJ2xDD3q-FK5lg8UreQkw/viewform" target="_blank" rel="noopener noreferrer">
          <strong>文章で伝える</strong>
          <span>Googleフォーム <span aria-hidden="true">&#8599;</span></span>
        </a>
        <a class="feedback-choice" href="https://furuhashilab.github.io/gyoda-kakikomi-map/" target="_blank" rel="noopener noreferrer">
          <strong>地図に書き込む</strong>
          <span>書き込みマップ <span aria-hidden="true">&#8599;</span></span>
        </a>
        <p class="feedback-note">どちらも別タブで開きます。投稿は自動公開せず、管理者が確認して掲載を判断します。</p>
        <p class="feedback-note">GoogleフォームはGoogleへのログインが必要です。利用条件・写真の掲載許可は、各投稿先でご確認ください。</p>
      </div>
    </section>
  </div>

  <script src="js/spot-data.js?v=20261017-2"></script>
  <script src="js/publication-data.js?v=20261029-1"></script>
  <script src="js/spot-card.js?v=20261017-2"></script>
  <script src="js/geojson-data.js?v=20261017-3"></script>
  <script src="js/map-preview.js?v=20261018-2"></script>
  <script src="js/feedback-entry.js?v=20261112-1"></script>
  <script src="main.js?v=20261112-1"></script>
</body>
</html>
